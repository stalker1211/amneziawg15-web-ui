# nginx's main context (Alpine's nginx.conf includes /etc/nginx/conf.d/*.conf there).
#
# A settings save reloads nginx (web-ui/core/nginx_conf.py). The old workers finish
# their requests first, and GET /api/events never finishes by design, so without a
# limit they would live as long as a page stays open. After 10 s they close their
# connections; the page reconnects and resyncs on its own (core/events.py, app.js).
worker_shutdown_timeout 10s;
