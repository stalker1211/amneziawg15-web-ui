server {
    listen 80;
    server_name _;

    set_real_ip_from 172.17.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # On every response, 401s included. A location with its own add_header would
    # drop these (nginx inherits add_header only into locations that set none).
    # script-src 'self': the page has no inline script or handler (data-action), and
    # everything it loads is served from here.
    add_header Content-Security-Policy "script-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Root directory for static files
    root /app/web-ui;
    index index.html;

    # Serve static files
    location /static/ {
        alias /app/web-ui/static/;
        expires 1m;
    }

    # Proxy to Flask application
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        auth_basic "Restricted Content";
        auth_basic_user_file /etc/amnezia/.htpasswd;
    }
    
    # API routes
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        auth_basic "Restricted Content";
        auth_basic_user_file /etc/amnezia/.htpasswd;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # CRITICAL: Include the original Host header with port
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # WebSocket specific settings
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
        proxy_cache off;

        # No auth_basic here: WebKit does not reliably reattach cached Basic Auth
        # credentials to a WebSocket upgrade handshake (observed as endless
        # re-prompts on iPadOS Safari). Authorization instead rides the session
        # cookie Flask sets on any request that already cleared Basic Auth on
        # location / or /api/ above -- see mark_authenticated() in web-ui/core/guards.py
        # and handle_connect() in web-ui/core/runtime.py.
    }

    location /status {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:5000/status;
    }
}