# The access log goes to the container's output (supervisord passes nginx's stdout on
# to `docker logs`), one line per request: the time, a level from the status, then the
# request. The health check's /status, every 30 s, is left out. A 401 is info: the
# browser's first request always gets one, and failed sign-ins are auth.fail events.
map $request_uri $awg_loggable {
    /status 0;
    default 1;
}
map $status $awg_level {
    401 info;
    ~^5 error;
    ~^4 warning;
    default info;
}
log_format awg '$time_iso8601 $awg_level $status $request_method $request_uri '
               '$remote_addr user=$remote_user bytes=$body_bytes_sent';

server {
    listen 80;
    server_name _;

    access_log /dev/stdout awg if=$awg_loggable;
    # Both: the file is where services/authlog.py reads failed sign-ins (a server-level
    # error_log replaces the inherited one, so it has to be named again), stderr is the
    # container's output.
    error_log /var/log/nginx/error.log warn;
    error_log stderr warn;

    set_real_ip_from 172.17.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # On every response, 401s included. A location with its own add_header would
    # drop these (nginx inherits add_header only into locations that set none).
    # script-src 'self': the page has no inline script or handler (data-action), and
    # everything it loads is served from here.
    add_header Content-Security-Policy "script-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Root directory for static files
    root /app/web-ui;
    index index.html;

    # Serve static files
    location /static/ {
        alias /app/web-ui/static/;
        expires 1m;
    }

    # Proxy to Flask application
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        auth_basic "Restricted Content";
        auth_basic_user_file /etc/amnezia/.htpasswd;
    }

    # API routes. GET /api/events, the page's live updates, is a response that never
    # ends: it sends X-Accel-Buffering: no, which turns buffering off for it alone, and
    # a heartbeat every 15 s, inside proxy_read_timeout's 60 s.
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        auth_basic "Restricted Content";
        auth_basic_user_file /etc/amnezia/.htpasswd;
    }

    location /status {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:5000/status;
    }
}