server {
    listen 80;
    server_name _;

    set_real_ip_from 172.17.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # On every response, 401s included. A location with its own add_header would
    # drop these (nginx inherits add_header only into locations that set none).
    # script-src 'self': the page has no inline script or handler (data-action), and
    # everything it loads is served from here.
    add_header Content-Security-Policy "script-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Root directory for static files
    root /app/web-ui;
    index index.html;

    # Serve static files
    location /static/ {
        alias /app/web-ui/static/;
        expires 1m;
    }

    # Proxy to Flask application
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        auth_basic "Restricted Content";
        auth_basic_user_file /etc/amnezia/.htpasswd;
    }

    # API routes. GET /api/events, the page's live updates, is a response that never
    # ends: it sends X-Accel-Buffering: no, which turns buffering off for it alone, and
    # a heartbeat every 15 s, inside proxy_read_timeout's 60 s.
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        auth_basic "Restricted Content";
        auth_basic_user_file /etc/amnezia/.htpasswd;
    }

    location /status {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:5000/status;
    }
}