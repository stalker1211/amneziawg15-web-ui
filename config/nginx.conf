# The access log goes to the container's output (supervisord passes nginx's stdout on
# to `docker logs`), one line per request: the time, a level from the status, then the
# request. Which requests follow the panel's log level: the generated include below
# (web-ui/core/nginx_conf.py) picks one of the $awg_log_* gates. /status (the health
# check, every 30 s) and /static/ (a dozen files per page load) are never logged.
map $request_uri $awg_quiet {
    default 0;
    /status 1;
    ~^/static/ 1;
}
# "<quiet><status>", e.g. "0200": every request (DEBUG); the failed ones, 4xx but 401
# and 5xx (INFO, WARNING); 5xx (ERROR). Exact keys win over regexes in a map.
map "$awg_quiet$status" $awg_log_debug {
    default 1;
    ~^1 0;
}
map "$awg_quiet$status" $awg_log_warning {
    default 0;
    "0401" 0;
    ~^0[45] 1;
}
map "$awg_quiet$status" $awg_log_error {
    default 0;
    ~^05 1;
}
# The line's level. A 401 is debug: a browser's first request always gets one, and
# failed sign-ins are auth.fail events.
map $status $awg_level {
    401 debug;
    ~^5 error;
    ~^4 warning;
    default debug;
}
log_format awg '$time_iso8601 $awg_level $status $request_method $request_uri '
               '$remote_addr user=$remote_user bytes=$body_bytes_sent';

server {
    listen 80;
    server_name _;

    # The file is where services/authlog.py reads failed sign-ins (a server-level
    # error_log replaces the inherited one, so it has to be named again); the include
    # adds `error_log stderr` for the container's output.
    error_log /var/log/nginx/error.log warn;

    # Generated from the panel's settings: the access_log (by the log level),
    # `error_log stderr` and `set_real_ip_from` per trusted proxy. Never edit it.
    include /etc/nginx/awg/settings.conf;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # On every response, 401s included. A location with its own add_header would
    # drop these (nginx inherits add_header only into locations that set none).
    # script-src 'self': the page has no inline script or handler (data-action), and
    # everything it loads is served from here.
    add_header Content-Security-Policy "script-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Root directory for static files
    root /app/web-ui;
    index index.html;

    # Serve static files
    location /static/ {
        alias /app/web-ui/static/;
        expires 1m;
    }

    # Proxy to Flask application
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        auth_basic "Restricted Content";
        auth_basic_user_file /etc/amnezia/.htpasswd;
    }

    # API routes. GET /api/events, the page's live updates, is a response that never
    # ends: it sends X-Accel-Buffering: no, which turns buffering off for it alone, and
    # a heartbeat every 15 s, inside proxy_read_timeout's 60 s.
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        auth_basic "Restricted Content";
        auth_basic_user_file /etc/amnezia/.htpasswd;
    }

    location /status {
        allow 127.0.0.1;
        deny all;
        # allow sees the address realip took from X-Forwarded-For: a trusted proxy
        # forwarding "X-Forwarded-For: 127.0.0.1" would pass it. The health check
        # connects from 127.0.0.1 itself, so the connection's own address must be that.
        if ($realip_remote_addr != "127.0.0.1") {
            return 403;
        }
        proxy_pass http://127.0.0.1:5000/status;
    }
}