; Every log line goes to the container's output (`docker logs`), none to files:
; supervisord's own (nodaemon writes them to stdout; logfile=/dev/null drops the copy)
; and each program's stdout and stderr. maxbytes=0 because a pipe cannot be rotated.
; The two files the panel reads stay: nginx's error log (failed sign-ins, nginx.conf
; names it beside stderr) and AWG_LOG_FILE (the daemon's, ⋯ → AWG Logs).
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[program:nginx]
command=nginx -g 'daemon off;'
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:webui]
command=python3 /app/web-ui/app.py
directory=/app/web-ui
autostart=true
autorestart=true
environment=PYTHONUNBUFFERED=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
