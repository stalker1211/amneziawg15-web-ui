<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AmneziaWG Web UI</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <!-- Everything is served from this origin: no CDN, works offline. vendor/ holds
         unmodified release files (hashes pinned in tests/test_frontend.py);
         tailwind.css is built by build_css.sh and loads after style.css, as the
         old in-browser Tailwind did, so utilities win ties with style.css. -->
    <script src="{{ url_for('static', filename='vendor/socket.io-4.8.4.js') }}"></script>
    <script src="{{ url_for('static', filename='vendor/qrcode-1.0.0.min.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v={{ cache_bust }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind.css') }}?v={{ cache_bust }}">
</head>
<body class="bg-[#e9ebef] text-gray-900 dark:bg-[#111827] dark:text-[#e5e7eb] antialiased">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-6 sm:py-8 flex flex-col gap-5">
        <header class="flex flex-wrap items-start justify-between gap-4">
            <div>
                <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-gray-900 dark:text-[#f1f5f9]">AmneziaWG Web UI</h1>
                <p class="mt-1 text-xs font-mono text-gray-700 dark:text-[#bac5d4]">{{ build_label }}</p>
            </div>
            <div class="flex items-center gap-2">
                <span id="statusFrame" data-state="connecting" title="Connecting"
                      class="inline-flex items-center gap-2 h-9 px-3 rounded-full border border-gray-400 bg-white text-sm text-gray-800 dark:bg-[#1f2937] dark:border-[#334155] dark:text-[#d7dee9]">
                    <span id="statusDot" class="w-2 h-2 rounded-full bg-gray-400"></span><span id="status">Connecting…</span>
                </span>
                <button id="settingsBtn" type="button" data-action="open-settings" aria-label="Panel settings" title="Panel settings"
                        class="icon-btn border border-gray-400 bg-white dark:bg-[#1f2937] dark:border-[#334155]">
                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                </button>
                <button id="themeToggleBtn" type="button" aria-label="Switch theme"
                        class="icon-btn border border-gray-400 bg-white dark:bg-[#1f2937] dark:border-[#334155]"></button>
            </div>
        </header>

        <!-- Shown while the credential is start.sh's admin/changeme (page_config's passwordIsDefault). -->
        <!-- `hidden` sits on a wrapper with no display class: Tailwind's .flex would win over it. -->
        <div id="passwordBanner" role="alert" hidden>
            <div class="rounded-xl border px-4 py-3 text-sm flex flex-wrap items-center justify-between gap-3 bg-amber-50 border-amber-200 text-amber-900 dark:bg-[#2b1d05] dark:border-[#78350f] dark:text-[#fde68a]">
                <span><strong class="font-semibold">Default password.</strong> <span id="passwordBannerText">This panel still signs in with <span class="font-mono">changeme</span>.</span></span>
                <button type="button" class="btn btn-secondary btn-sm" data-action="open-settings">Change it in Settings</button>
            </div>
        </div>

        <!-- Status strip: public IP, servers running, clients online (handshake <= 5 min). -->
        <section aria-label="Status"
                 class="grid grid-cols-1 sm:grid-cols-3 rounded-xl border border-gray-400 bg-white dark:bg-[#1f2937] dark:border-[#334155]">
            <div class="flex items-center justify-between gap-3 px-4 py-3 min-w-0">
                <span class="section-title">Public IP</span>
                <span class="flex items-center gap-1">
                    <span id="publicIp" class="font-mono text-sm font-medium text-gray-900 dark:text-[#f1f5f9]">Detecting…</span>
                    <button id="refreshIpBtn" type="button" class="icon-btn icon-btn-sm" aria-label="Detect public IP again" title="Detect public IP again">
                        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
                    </button>
                </span>
            </div>
            <div class="flex items-center justify-between gap-3 px-4 py-3 min-w-0 border-t sm:border-t-0 sm:border-l border-gray-300 dark:border-[#334155]">
                <span class="section-title">Servers</span>
                <span class="text-sm"><strong id="stripServersRunning" class="font-semibold tabular-nums text-gray-900 dark:text-[#f1f5f9]">–</strong> of <span id="stripServersTotal">–</span> running</span>
            </div>
            <div class="flex items-center justify-between gap-3 px-4 py-3 min-w-0 border-t sm:border-t-0 sm:border-l border-gray-300 dark:border-[#334155]">
                <span class="section-title">Clients</span>
                <span class="text-sm"><strong id="stripClientsOnline" class="font-semibold tabular-nums text-gray-900 dark:text-[#f1f5f9]">–</strong> of <span id="stripClientsTotal">–</span> online</span>
            </div>
        </section>

        <section class="flex flex-col gap-3" aria-labelledby="serversHeading">
            <div class="flex items-center justify-between gap-3">
                <h2 id="serversHeading" class="text-lg font-semibold text-gray-900 dark:text-[#f1f5f9]">Servers</h2>
                <button id="showCreateServerBtn" type="button" class="btn btn-primary">
                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>New server
                </button>
            </div>
            <div id="serversList" class="flex flex-col gap-4">
                <p class="py-8 text-center text-sm text-gray-700 dark:text-[#bac5d4]">Loading servers…</p>
            </div>
        </section>
    </div>

    <!-- Roots for static/js/ui.js: the drawer (forms), centred dialogs (views and
         questions), the ⋯ menu and toasts. Hidden until used. -->
    <div id="drawerRoot" hidden>
        <div class="drawer-overlay fixed inset-0 z-40 bg-gray-900/40 dark:bg-black/60" data-close="drawer"></div>
        <aside id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle"
               class="drawer-panel fixed inset-y-0 right-0 z-40 w-full sm:w-[34rem] flex flex-col bg-white border-l border-gray-300 shadow-2xl dark:bg-[#1f2937] dark:border-[#334155]">
            <header class="flex items-start justify-between gap-3 px-5 py-4 border-b border-gray-300 dark:border-[#334155]">
                <div class="min-w-0">
                    <h2 id="drawerTitle" class="text-lg font-semibold text-gray-900 dark:text-[#f1f5f9]"></h2>
                    <p id="drawerSub" class="text-sm text-gray-700 dark:text-[#bac5d4]"></p>
                </div>
                <button type="button" class="icon-btn" data-close="drawer" aria-label="Close">
                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
                </button>
            </header>
            <form id="drawerForm" class="flex-1 min-h-0 flex flex-col" novalidate>
                <div id="drawerBody" class="flex-1 overflow-y-auto px-5 py-5 flex flex-col gap-6"></div>
                <footer id="drawerFoot" class="px-5 py-3 border-t border-gray-300 dark:border-[#334155] flex flex-wrap items-center gap-2"></footer>
            </form>
        </aside>
    </div>

    <div id="dialogRoot" hidden>
        <div class="dialog-overlay fixed inset-0 z-50 bg-gray-900/50 dark:bg-black/70" data-close="dialog"></div>
        <div class="fixed inset-0 z-50 overflow-y-auto pointer-events-none">
            <div class="min-h-full flex items-center justify-center p-4">
                <div id="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"
                     class="dialog-panel pointer-events-auto w-full max-w-lg rounded-xl bg-white shadow-2xl border border-gray-400 dark:bg-[#1f2937] dark:border-[#334155]"></div>
            </div>
        </div>
    </div>

    <div id="menu" role="menu" hidden
         class="fixed z-[55] min-w-[12rem] py-1 rounded-lg border border-gray-400 bg-white shadow-lg dark:bg-[#1f2937] dark:border-[#334155]"></div>

    <div id="toasts" aria-live="polite"
         class="toast-root fixed z-[60] right-4 left-4 sm:left-auto flex flex-col items-stretch sm:items-end gap-2 pointer-events-none"></div>

    <!-- The backend's protocol table, key lists and new-server defaults (page_config in
         routes/system.py). JSON, not script: CSP allows no inline script. -->
    <script type="application/json" id="appConfig">{{ app_config | tojson }}</script>
    <script src="{{ url_for('static', filename='js/protocols.js') }}?v={{ cache_bust }}"></script>
    <script src="{{ url_for('static', filename='js/ui.js') }}?v={{ cache_bust }}"></script>
    <script src="{{ url_for('static', filename='js/api.js') }}?v={{ cache_bust }}"></script>
    <script src="{{ url_for('static', filename='js/server-ui.js') }}?v={{ cache_bust }}"></script>
    <!-- app.js defines AmneziaApp and creates the instance; modals.js and forms.js
         add methods to its prototype. It starts on DOMContentLoaded, after all three. -->
    <script src="{{ url_for('static', filename='js/app.js') }}?v={{ cache_bust }}"></script>
    <script src="{{ url_for('static', filename='js/modals.js') }}?v={{ cache_bust }}"></script>
    <script src="{{ url_for('static', filename='js/forms.js') }}?v={{ cache_bust }}"></script>
</body>
</html>
